name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The JSON APIs read the incoming request, and a static export cannot
      # serve that. Pages builds the site without them; Vercel keeps them live.
      - name: Drop server-only API routes
        run: rm -rf app/api

      # GH_PAGES=true turns on `output: 'export'` and the repo-name basePath.
      # See lib/pages-export.ts and the comment in next.config.ts.
      - name: Build the static site
        run: bun run build
        env:
          GH_PAGES: 'true'
          NEXT_PUBLIC_SITE_URL: https://aniruddhaadak80.github.io/wow-repo

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Jekyll is the default Pages processor and skips underscore
      # directories, which would drop the entire _next asset folder.
      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
