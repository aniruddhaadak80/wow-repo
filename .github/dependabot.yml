version: 2
updates:
  # Dependencies are the slowest-moving risk in a demo repo: a stale lockfile
  # breaks `bun install --frozen-lockfile` in CI long before it breaks locally.
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore'
      prefixSeparator: ': '
    groups:
      next:
        patterns:
          - 'next'
          - 'react'
          - 'react-dom'
          - 'eslint-config-next'
      tooling:
        patterns:
          - 'typescript'
          - 'eslint'
          - 'prettier'
          - 'vitest'
          - '*eslint*'
          - '*prettier*'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    commit-message:
      prefix: 'ci'
      prefixSeparator: ': '
